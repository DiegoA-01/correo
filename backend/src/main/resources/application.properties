spring.application.name=correo-backend

# Render asigna el puerto en la variable PORT
server.port=${PORT:8080}

# URL del Cloudflare Worker, p. ej. https://weathered-fog-b4e0.tu-subdominio.workers.dev
app.worker-url=${WORKER_URL:http://localhost:8787}
# Clave compartida con el Worker (igual a INTERNAL_API_KEY en Cloudflare)
app.worker-internal-key=${WORKER_INTERNAL_KEY:}
# URL del frontend en Netlify (varias separadas por coma)
app.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}
