# Nombre del Worker que ya existe en tu cuenta de Cloudflare.
name = "weathered-fog-b4e0"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Remitente verificado en SendGrid (Settings → Sender Authentication → Single Sender o dominio).
FROM_EMAIL = "tu-correo-verificado@gmail.com"
FROM_NAME = "Sistema de Correos"

# Los secretos NO van aquí. Súbelos así:
#   npx wrangler secret put SENDGRID_API_KEY
#   npx wrangler secret put INTERNAL_API_KEY   (la misma clave que WORKER_INTERNAL_KEY en Render)
